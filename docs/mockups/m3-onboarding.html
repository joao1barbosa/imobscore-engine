<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M3 · Onboarding · ImobScore</title>
<!-- Só nos mockups: CDN é permitido aqui (seção 1.8). As cores vêm do theme.css real. -->
<link rel="stylesheet" href="../../frontend/src/styles/theme.css">
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.68.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:is(.dark *));
  @theme inline {
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --color-score-low: var(--score-low);
    --color-score-mid: var(--score-mid);
    --color-score-high: var(--score-high);
    --color-score-foreground: var(--score-foreground);
  }
  @layer base {
    * { @apply border-border; }
    body { @apply bg-background text-foreground font-sans antialiased; }
    [data-lucide] { @apply inline-block size-4 shrink-0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const stateId = params.get("state");
const theme = params.get("theme") === "dark" ? "dark" : "light";
document.documentElement.classList.toggle("dark", theme === "dark");
const brl = (v) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }).format(v);
const dec = (v, d = 1) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const focusRing = "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring";
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const header = (active) => {
  const link = (id, label) => `<a href="#" ${active === id ? 'aria-current="page"' : ""} class="rounded-md px-2 py-1 text-sm font-medium ${active === id ? "bg-accent text-accent-foreground" : "text-muted-foreground hover:text-foreground"} ${focusRing}">${label}</a>`;
  return `<header class="border-b bg-card">
    <div class="mx-auto flex h-12 max-w-5xl items-center justify-between gap-3 px-4 md:h-14">
      <span class="font-semibold tracking-tight text-primary md:text-lg">ImobScore</span>
      ${active ? `<nav class="flex items-center gap-1" aria-label="Navegação">${link("feed", "Feed")}${link("model", "Modelo")}${link("experiment", "Experimento")}</nav>` : ""}
      <span class="${active ? "hidden md:inline" : ""} rounded-md bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground">Catálogo de demonstração</span>
    </div>
  </header>`;
};
const shell = (inner, { active = null, width = "max-w-5xl" } = {}) => `
  <div class="flex min-h-dvh flex-col">${header(active)}
    <main class="mx-auto flex w-full ${width} flex-1 flex-col gap-4 px-4 py-5 md:gap-6 md:py-10">${inner}${active ? `<p class="text-center text-xs text-muted-foreground md:hidden">Catálogo de demonstração</p>` : ""}</main>
  </div>`;
const message = (icon, tone, title, description, action = "", opts = {}) => shell(`
  <div class="my-auto flex flex-col items-center gap-3 text-center">
    <span class="grid size-12 place-items-center rounded-full ${tone}"><i data-lucide="${icon}" class="size-6"></i></span>
    <h1 class="text-xl font-semibold tracking-tight">${title}</h1>
    <p class="max-w-md text-sm text-muted-foreground">${description}</p>${action}
  </div>`, opts);
const retry = `<button type="button" class="mt-1 inline-flex h-10 items-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:opacity-90 ${focusRing}"><i data-lucide="refresh-cw"></i>Tentar de novo</button>`;
const toast = (text) => `<div role="alert" class="fixed inset-x-4 bottom-4 mx-auto flex max-w-md items-center gap-2 rounded-lg border border-destructive bg-card p-3 text-sm font-medium text-card-foreground shadow-lg"><i data-lucide="triangle-alert" class="text-destructive"></i>${text}</div>`;
const skeleton = (h) => `<div class="${h} w-full animate-pulse rounded-md bg-muted"></div>`;
const PERSONAS = [
  { slug: "familia", icon: "users", name: "Família", description: "Prioriza espaço, quartos e vagas, mesmo pagando um pouco mais.", range: [350000, 900000] },
  { slug: "investidor", icon: "trending-up", name: "Investidor", description: "Busca bom preço e localização, pensando em alugar ou revender.", range: [200000, 600000] },
  { slug: "estudante", icon: "graduation-cap", name: "Estudante", description: "Quer pagar pouco e morar perto do centro.", range: [150000, 350000] },
];

const floor = 180000, ceiling = 1950000;
const stepper = (n) => `
  <div class="flex items-center gap-3" aria-live="polite">
    <span class="shrink-0 text-sm font-medium">Passo ${n} de 2</span>
    <div class="h-2 flex-1 overflow-hidden rounded-full bg-secondary"><div class="h-full rounded-full bg-primary" style="width:${n * 50}%"></div></div>
  </div>`;
const title = (h, p) => `<div class="flex flex-col gap-1"><h1 class="text-2xl font-semibold tracking-tight md:text-3xl">${h}</h1><p class="text-muted-foreground md:text-lg">${p}</p></div>`;
const fieldError = (msg) => (msg ? `<p class="flex items-center gap-1.5 text-sm font-medium text-destructive"><i data-lucide="circle-alert"></i>${msg}</p>` : "");
function priceCard(v = {}) {
  const pct = (x) => ((x - floor) / (ceiling - floor)) * 100;
  const min = v.min ?? floor, max = v.max ?? ceiling, low = Math.min(min, max), high = Math.max(min, max);
  const thumb = (x, name) => `<span role="slider" aria-label="${name}" class="absolute top-1/2 size-6 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-primary bg-card shadow" style="left:${pct(x)}%"></span>`;
  const money = (id, name, val, err) => `<div class="flex min-w-0 flex-1 flex-col gap-1.5"><label for="${id}" class="text-sm text-muted-foreground">${name}</label>
    <input id="${id}" inputmode="numeric" value="${brl(val)}" class="h-11 w-full min-w-0 rounded-md border ${err ? "border-destructive" : "border-input"} bg-card px-3 text-base tabular-nums ${focusRing}"></div>`;
  return `<section class="flex flex-col gap-4 rounded-xl border bg-card p-4 shadow-sm md:p-6">
    <p class="flex items-center gap-2 rounded-lg bg-muted p-3 text-sm font-medium"><i data-lucide="map-pin" class="text-primary"></i>Imóveis à venda em Goiânia-GO</p>
    <span class="text-sm font-medium">Faixa de preço</span>
    <div class="relative mx-3 h-6">
      <div class="absolute inset-x-0 top-1/2 h-2 -translate-y-1/2 rounded-full bg-secondary"></div>
      <div class="absolute top-1/2 h-2 -translate-y-1/2 rounded-full bg-primary" style="left:${pct(low)}%;right:${100 - pct(high)}%"></div>
      ${thumb(min, "Mínimo")}${thumb(max, "Máximo")}
    </div>
    <div class="flex gap-3">${money("price-min", "Mínimo", min)}${money("price-max", "Máximo", max, v.error)}</div>
    ${v.error ? fieldError(v.error) : `<p class="text-sm text-muted-foreground">Neste catálogo: de ${brl(floor)} a ${brl(ceiling)}</p>`}
  </section>`;
}
function personaCards(selected, error) {
  const card = (p) => {
    const on = selected === p.slug;
    return `<label class="relative flex cursor-pointer items-start gap-3 rounded-lg border bg-card p-4 md:flex-col md:gap-2 ${on ? "border-primary bg-accent text-accent-foreground ring-1 ring-primary" : error ? "border-destructive" : "border-input"}">
      <span class="grid size-10 shrink-0 place-items-center rounded-md ${on ? "bg-primary text-primary-foreground" : "bg-secondary text-secondary-foreground"}"><i data-lucide="${p.icon}"></i></span>
      <span class="flex flex-col gap-0.5"><span class="font-semibold">${p.name}</span><span class="text-sm ${on ? "" : "text-muted-foreground"}">${p.description}</span></span>
      ${on ? '<i data-lucide="check" class="absolute right-3 top-3 text-primary"></i>' : ""}
    </label>`;
  };
  return `<div class="flex flex-col gap-2" role="radiogroup" aria-label="Qual perfil mais parece com você?"><div class="grid gap-3 md:grid-cols-3">${PERSONAS.map(card).join("")}</div>${fieldError(error)}</div>`;
}
const buttons = (back, label, opts = {}) => `<div class="flex flex-col-reverse gap-2 md:flex-row md:justify-between">
  ${back ? `<button type="button" ${opts.sending ? "disabled" : ""} class="inline-flex h-12 items-center justify-center gap-2 rounded-md border border-input bg-card px-6 font-medium hover:bg-accent disabled:opacity-60 ${focusRing}"><i data-lucide="arrow-left"></i>Voltar</button>` : "<span></span>"}
  <button type="submit" ${opts.sending ? "disabled" : ""} class="inline-flex h-12 items-center justify-center gap-2 rounded-md bg-primary px-6 font-medium text-primary-foreground hover:opacity-90 disabled:opacity-70 ${focusRing}">${opts.sending ? '<i data-lucide="loader-circle" class="animate-spin"></i>Preparando os pares' : label + '<i data-lucide="arrow-right"></i>'}</button>
</div>`;
const OPTS = { width: "max-w-2xl" };
const step1 = (v) => shell(stepper(1) + title("Quanto você quer pagar?", "Só mostramos imóveis perto dessa faixa.") + priceCard(v) + buttons(false, "Continuar"), OPTS);
const step2 = (sel, err, b = {}) => shell(stepper(2) + title("Qual perfil mais parece com você?", "Ele é só o ponto de partida: suas escolhas ajustam o resto.") + personaCards(sel, err) + buttons(true, "Começar as comparações", b), { width: "max-w-4xl" });
const SCREENS = {
  step1: () => step1({ min: 350000, max: 900000 }),
  step2: () => step2("familia"),
  "step1-error": () => step1({ min: 900000, max: 350000, error: "O máximo precisa ser maior que o mínimo" }),
  "step2-error": () => step2(null, "Escolha um perfil"),
  sending: () => step2("familia", null, { sending: true }),
  "submit-error": () => step2("familia") + toast("Não foi possível começar. Tente de novo."),
  loading: () => shell(stepper(1) + title("Quanto você quer pagar?", "Só mostramos imóveis perto dessa faixa.") + `<div aria-busy="true" class="flex flex-col gap-4 rounded-xl border bg-card p-4 md:p-6"><span class="sr-only" role="status">Carregando o formulário</span>${skeleton("h-11")}${skeleton("h-6")}${skeleton("h-16")}</div>`, OPTS),
  empty: () => message("package-open", "bg-secondary text-secondary-foreground", "O catálogo ainda não está disponível", "Rode o comando de carga do catálogo e tente de novo.", "", OPTS),
  error: () => message("triangle-alert", "bg-destructive text-destructive-foreground", "Não foi possível abrir esta tela", "Verifique sua conexão e tente de novo.", retry, OPTS),
};
const STATES = [
  { id: "step1", label: "Passo 1 · Faixa de preço", note: "Goiânia e compra são fixas. O slider anda em passos de R$ 10 mil." },
  { id: "step2", label: "Passo 2 · Perfil", note: "O perfil é o ponto de partida, e a tela diz isso para não parecer um rótulo definitivo." },
  { id: "step1-error", label: "Erro no passo 1", note: "O passo só avança com a faixa válida." },
  { id: "step2-error", label: "Erro no passo 2", note: "Enviar sem perfil mostra o erro abaixo dos cartões." },
  { id: "sending", label: "Enviando", note: "POST /sessions em andamento." },
  { id: "submit-error", label: "Erro ao enviar", note: "Aviso, e as escolhas não se perdem." },
  { id: "loading", label: "Carregando", note: "GET /meta/options e /meta/personas em andamento." },
  { id: "empty", label: "Vazio", note: "A API respondeu sem segmento ou sem personas." },
  { id: "error", label: "Erro ao carregar", note: "Falha nos metadados." },
];


function renderGallery() {
  const q = (s) => `?state=${s.id}&theme=${theme}`;
  const frame = (s, width, height, name) => `
    <div class="flex flex-col gap-1">
      <span class="text-xs font-medium text-muted-foreground">${name}</span>
      <div class="overflow-hidden rounded-lg border-2 bg-card">
        <iframe title="${s.id} ${name}" loading="lazy" data-w="${width}" data-frame="${s.id}-${width}"
          src="${q(s)}&frame=${s.id}-${width}" style="width:${width}px;height:${height}px;border:0;transform-origin:0 0;display:block"></iframe>
      </div>
    </div>`;
  document.getElementById("root").innerHTML = `
    <div class="min-h-dvh bg-muted p-6">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">M3 · Onboarding <span class="font-normal text-muted-foreground">versão 1</span></h1>
          <p class="text-sm text-muted-foreground">Rota /comecar, em dois passos. Especificação em m3-onboarding.md.</p>
        </div>
        <a class="rounded-md border bg-card px-3 py-2 text-sm font-medium" href="?theme=${theme === "dark" ? "light" : "dark"}">Ver no tema ${theme === "dark" ? "claro" : "escuro"}</a>
      </header>
      <div class="flex flex-col gap-10">
        ${STATES.map((s) => `
          <section>
            <h2 class="text-lg font-semibold">${s.label}</h2>
            <p class="mb-2 text-sm text-muted-foreground">${s.note} <a class="underline" target="_blank" href="${q(s)}">Abrir em tamanho real</a></p>
            <div class="flex items-start gap-6">
              ${frame(s, 375, 667, "Celular · 375 px")}
              ${frame(s, 1280, 800, "Notebook · 1280 px")}
            </div>
          </section>`).join("")}
      </div>
    </div>`;
  const fit = () => {
    const available = document.getElementById("root").clientWidth - 48 - 375 - 24 - 8;
    const scale = Math.min(1, Math.max(0.4, available / 1280));
    document.querySelectorAll("iframe[data-w='1280']").forEach((f) => {
      f.style.transform = `scale(${scale})`;
      const box = f.parentElement;
      box.style.width = `${1280 * scale + 4}px`;
      box.style.height = `${parseFloat(f.style.height) * scale + 4}px`;
    });
  };
  addEventListener("resize", fit);
  addEventListener("message", (e) => {
    const f = document.querySelector(`iframe[data-frame="${e.data?.frame}"]`);
    if (f && e.data.height > parseFloat(f.style.height)) { f.style.height = `${e.data.height}px`; fit(); }
  });
  fit();
}

if (stateId) {
  document.getElementById("root").innerHTML = (SCREENS[stateId] || SCREENS[STATES[0].id])();
  if (typeof afterRender === "function") afterRender(stateId);
} else {
  renderGallery();
}
if (window.lucide) lucide.createIcons();
if (stateId && parent !== window) {
  const frame = params.get("frame");
  const send = () => parent.postMessage({ frame, height: document.documentElement.scrollHeight }, "*");
  addEventListener("load", send);
  new ResizeObserver(send).observe(document.body);
}
</script>
</body>
</html>
