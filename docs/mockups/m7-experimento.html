<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M7 · Painel do experimento · ImobScore</title>
<!-- Só nos mockups: CDN é permitido aqui (seção 1.8). As cores vêm do theme.css real. -->
<link rel="stylesheet" href="../../frontend/src/styles/theme.css">
<style>
  @font-face {
    font-family: "Geist Variable";
    src: url("https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/files/geist-latin-wght-normal.woff2") format("woff2");
    font-weight: 100 900;
    font-display: swap;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@1.68.0/dist/umd/lucide.min.js"></script>
<style type="text/tailwindcss">
  @custom-variant dark (&:is(.dark *));
  @theme inline {
    --radius-md: calc(var(--radius) - 2px);
    --radius-lg: var(--radius);
    --radius-xl: calc(var(--radius) + 4px);
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-secondary: var(--secondary);
    --color-secondary-foreground: var(--secondary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-accent: var(--accent);
    --color-accent-foreground: var(--accent-foreground);
    --color-destructive: var(--destructive);
    --color-destructive-foreground: var(--destructive-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --color-score-low: var(--score-low);
    --color-score-mid: var(--score-mid);
    --color-score-high: var(--score-high);
    --color-score-foreground: var(--score-foreground);
  }
  @layer base {
    * { @apply border-border; }
    body { @apply bg-background text-foreground font-sans antialiased; }
    [data-lucide] { @apply inline-block size-4 shrink-0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const params = new URLSearchParams(location.search);
const stateId = params.get("state");
const theme = params.get("theme") === "dark" ? "dark" : "light";
document.documentElement.classList.toggle("dark", theme === "dark");
const brl = (v) => new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }).format(v);
const dec = (v, d = 1) => new Intl.NumberFormat("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }).format(v);
const focusRing = "focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring";
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

const header = (active) => {
  const link = (id, label) => `<a href="#" ${active === id ? 'aria-current="page"' : ""} class="rounded-md px-2 py-1 text-sm font-medium ${active === id ? "bg-accent text-accent-foreground" : "text-muted-foreground hover:text-foreground"} ${focusRing}">${label}</a>`;
  return `<header class="border-b bg-card">
    <div class="mx-auto flex h-12 max-w-5xl items-center justify-between gap-3 px-4 md:h-14">
      <span class="font-semibold tracking-tight text-primary md:text-lg">ImobScore</span>
      ${active ? `<nav class="flex items-center gap-1" aria-label="Navegação">${link("feed", "Feed")}${link("model", "Modelo")}${link("experiment", "Experimento")}</nav>` : ""}
      <span class="${active ? "hidden md:inline" : ""} rounded-md bg-secondary px-2 py-0.5 text-xs font-medium text-secondary-foreground">Catálogo de demonstração</span>
    </div>
  </header>`;
};
const shell = (inner, { active = null, width = "max-w-5xl" } = {}) => `
  <div class="flex min-h-dvh flex-col">${header(active)}
    <main class="mx-auto flex w-full ${width} flex-1 flex-col gap-4 px-4 py-5 md:gap-6 md:py-10">${inner}${active ? `<p class="text-center text-xs text-muted-foreground md:hidden">Catálogo de demonstração</p>` : ""}</main>
  </div>`;
const message = (icon, tone, title, description, action = "", opts = {}) => shell(`
  <div class="my-auto flex flex-col items-center gap-3 text-center">
    <span class="grid size-12 place-items-center rounded-full ${tone}"><i data-lucide="${icon}" class="size-6"></i></span>
    <h1 class="text-xl font-semibold tracking-tight">${title}</h1>
    <p class="max-w-md text-sm text-muted-foreground">${description}</p>${action}
  </div>`, opts);
const retry = `<button type="button" class="mt-1 inline-flex h-10 items-center gap-2 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:opacity-90 ${focusRing}"><i data-lucide="refresh-cw"></i>Tentar de novo</button>`;
const toast = (text) => `<div role="alert" class="fixed inset-x-4 bottom-4 mx-auto flex max-w-md items-center gap-2 rounded-lg border border-destructive bg-card p-3 text-sm font-medium text-card-foreground shadow-lg"><i data-lucide="triangle-alert" class="text-destructive"></i>${text}</div>`;
const skeleton = (h) => `<div class="${h} w-full animate-pulse rounded-md bg-muted"></div>`;
const PERSONAS = [
  { slug: "familia", icon: "users", name: "Família", description: "Prioriza espaço, quartos e vagas, mesmo pagando um pouco mais.", range: [350000, 900000] },
  { slug: "investidor", icon: "trending-up", name: "Investidor", description: "Busca bom preço e localização, pensando em alugar ou revender.", range: [200000, 600000] },
  { slug: "estudante", icon: "graduation-cap", name: "Estudante", description: "Quer pagar pouco e morar perto do centro.", range: [150000, 350000] },
];

const METHODS = [
  { key: "bayes", label: "Motor bayesiano", color: "--chart-1" },
  { key: "mle", label: "Regressão logística", color: "--chart-2" },
  { key: "persona", label: "Média da persona", color: "--chart-3" },
  { key: "equal", label: "Pesos iguais", color: "--chart-4" },
];
const NT = [3, 5, 10, 15];
const ROWS = {
  bayes: { acc: [.66, .69, .72, .74], sd: [.07, .06, .06, .05], ll: [.64, .61, .57, .54] },
  mle: { acc: [.55, .60, .68, .72], sd: [.09, .08, .06, .06], ll: [.86, .78, .63, .57] },
  persona: { acc: [.63, .63, .63, .63], sd: [.07, .07, .07, .07], ll: [.66, .66, .66, .66] },
  equal: { acc: [.58, .58, .58, .58], sd: [.08, .08, .08, .08], ll: [.69, .69, .69, .69] },
};
const PARTS = (prefix) => [["01", .78, .62, .70, .60], ["02", .72, .58, .64, .56], ["03", .64, .60, .66, .62], ["04", .70, .62, .58, .54], ["05", .66, .54, .60, .58], ["06", .68, .64, .62, .56]].map(([c, ...v]) => ({ code: prefix + c, v }));
const OPTS = { active: "experiment", width: "max-w-5xl" };
const pct = (v) => `${Math.round(v * 100)}%`;
const panel = (title, subtitle, inner) => `<section class="flex min-w-0 flex-col gap-3 rounded-xl border bg-card p-4 text-card-foreground shadow-sm md:p-6"><div><h2 class="text-lg font-semibold">${title}</h2>${subtitle ? `<p class="text-sm text-muted-foreground">${subtitle}</p>` : ""}</div>${inner}</section>`;
const legend = `<div class="flex flex-wrap gap-x-4 gap-y-1">${METHODS.map((m) => `<span class="inline-flex items-center gap-1.5 text-sm text-muted-foreground"><span class="size-2.5 rounded-full" style="background:var(${m.color})"></span>${m.label}</span>`).join("")}</div>`;
const intro = `<div class="flex flex-col gap-1"><h1 class="text-2xl font-semibold tracking-tight md:text-3xl">O experimento</h1><p class="text-muted-foreground md:text-lg">Com poucas escolhas, qual método acerta mais a preferência de cada pessoa?</p></div>`;
const how = (n) => `<p class="text-sm text-muted-foreground">${n} participantes. Cada um respondeu a 25 pares aleatórios: até 15 treinam os métodos, e 10 ficam de fora para o teste.</p>`;
const simulatedBanner = `<p role="alert" class="flex items-start gap-2 rounded-lg border border-destructive bg-card p-3 text-sm font-medium"><i data-lucide="triangle-alert" class="mt-0.5 text-destructive"></i>Dados simulados: estes resultados não vêm de pessoas reais.</p>`;
const tables = `<div class="overflow-x-auto"><table class="w-full min-w-[440px] text-left text-sm tabular-nums"><thead class="text-muted-foreground"><tr><th class="py-1 font-medium">Método</th>${NT.map((n) => `<th class="font-medium">${n} pares</th>`).join("")}</tr></thead>
  <tbody>${METHODS.map((m) => `<tr class="border-t"><td class="py-1.5 pr-2">${m.label}</td>${ROWS[m.key].acc.map((a, i) => `<td>${pct(a)} <span class="text-muted-foreground">· ${dec(ROWS[m.key].ll[i], 2)}</span></td>`).join("")}</tr>`).join("")}</tbody></table></div>
  <p class="text-xs text-muted-foreground">Cada célula mostra a acurácia e a perda logarítmica. Na perda, menor é melhor.</p>`;
const screen = (banner, prefix) => shell(`${intro}${banner}${how(6)}
  ${panel("Acurácia por número de pares", "Acerto em pares que os métodos nunca viram. A faixa mostra ±1 desvio.", `${legend}<div id="lines"></div>`)}
  ${panel("Números da curva", "", tables)}
  ${panel("Por participante, com 5 pares", "Os resultados saem por pessoa: são poucos colegas, em um estudo exploratório.", `${legend}<div id="bars" data-prefix="${prefix}"></div>`)}`, OPTS);
const SCREENS = {
  normal: () => screen("", "P"),
  simulated: () => screen(simulatedBanner, "S"),
  empty: () => message("flask-conical", "bg-secondary text-secondary-foreground", "Ainda não há resultados", "Os gráficos aparecem depois que a coleta terminar e a avaliação rodar.", "", OPTS),
  loading: () => shell(intro + `<div aria-busy="true" class="flex flex-col gap-4"><span class="sr-only" role="status">Carregando os resultados</span>${skeleton("h-80")}${skeleton("h-40")}</div>`, OPTS),
  error: () => message("triangle-alert", "bg-destructive text-destructive-foreground", "Não foi possível carregar os resultados", "Verifique sua conexão e tente de novo.", retry, OPTS),
};
function drawLines(el) {
  const width = el.clientWidth, height = width < 500 ? 240 : 320, left = 38, right = 14, top = 8, bottom = 38;
  const lo = .4, hi = .9, x = (n) => left + ((n - 3) / 12) * (width - left - right), y = (v) => top + ((hi - v) / (hi - lo)) * (height - top - bottom);
  const textC = css("--muted-foreground"), grid = css("--border"), surf = css("--card");
  let s = `<svg width="${width}" height="${height}" role="img" aria-label="Acurácia de cada método por número de pares de treino">`;
  [.4, .5, .6, .7, .8, .9].forEach((t) => { s += `<line x1="${left}" x2="${width - right}" y1="${y(t)}" y2="${y(t)}" stroke="${grid}"/><text x="${left - 6}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="${textC}">${pct(t)}</text>`; });
  NT.forEach((n) => { s += `<text x="${x(n)}" y="${height - 20}" text-anchor="middle" font-size="12" fill="${textC}">${n}</text>`; });
  s += `<text x="${(left + width - right) / 2}" y="${height - 4}" text-anchor="middle" font-size="12" fill="${textC}">Pares usados no treino</text>`;
  [...METHODS].reverse().forEach((m) => {
    const r = ROWS[m.key], c = css(m.color);
    const up = NT.map((n, i) => `${x(n)},${y(r.acc[i] + r.sd[i])}`), dn = NT.map((n, i) => `${x(n)},${y(r.acc[i] - r.sd[i])}`).reverse();
    s += `<polygon points="${[...up, ...dn].join(" ")}" fill="${c}" opacity="0.1"/>`;
    s += `<polyline points="${NT.map((n, i) => `${x(n)},${y(r.acc[i])}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    NT.forEach((n, i) => { s += `<circle cx="${x(n)}" cy="${y(r.acc[i])}" r="4" fill="${c}" stroke="${surf}" stroke-width="2"><title>${m.label}, ${n} pares: ${pct(r.acc[i])} (±${pct(r.sd[i])})</title></circle>`; });
  });
  el.innerHTML = s + "</svg>";
}
function drawBars(el) {
  const width = el.clientWidth, left = 40, right = 40, parts = PARTS(el.dataset.prefix), barH = 7, gap = 2, rowH = 4 * barH + 3 * gap + 12, top = 4, bottom = 22, height = top + rowH * parts.length + bottom;
  const x = (v) => left + (v / 1) * (width - left - right);
  const textC = css("--muted-foreground"), grid = css("--border"), fg = css("--foreground");
  let s = `<svg width="${width}" height="${height}" role="img" aria-label="Acurácia com 5 pares, por participante e método">`;
  [0, .25, .5, .75, 1].forEach((t) => { s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${height - bottom}" stroke="${grid}"/><text x="${x(t)}" y="${height - 6}" text-anchor="middle" font-size="12" fill="${textC}">${pct(t)}</text>`; });
  parts.forEach((p, i) => {
    const y0 = top + rowH * i + 4;
    s += `<text x="0" y="${y0 + (rowH - 12) / 2 + 4}" font-size="13" fill="${fg}">${p.code}</text>`;
    METHODS.forEach((m, j) => { const w = x(p.v[j]) - left, y = y0 + j * (barH + gap); s += `<path d="M${left} ${y}h${w - 3}a3 3 0 0 1 3 3v${barH - 6}a3 3 0 0 1 -3 3h${-(w - 3)}z" fill="${css(m.color)}"><title>${p.code}, ${m.label}: ${pct(p.v[j])}</title></path>`; });
  });
  el.innerHTML = s + "</svg>";
}
function afterRender() {
  const paint = () => {
    ["lines", "bars"].forEach((id) => { const el = document.getElementById(id); if (el) el.innerHTML = ""; });
    const l = document.getElementById("lines"); if (l) drawLines(l);
    const b = document.getElementById("bars"); if (b) drawBars(b);
  };
  paint();
  addEventListener("resize", paint);
  addEventListener("load", paint);
  setTimeout(paint, 400);
  if (document.fonts) document.fonts.ready.then(paint);
}
const STATES = [
  { id: "normal", label: "Normal", note: "Com dados reais. Passe o mouse nos pontos. Os números são ilustrativos e não antecipam o resultado." },
  { id: "simulated", label: "Dados simulados", note: "simulated = true: aviso fixo no topo." },
  { id: "empty", label: "Vazio", note: "run_id = null: ainda sem resultados." },
  { id: "loading", label: "Carregando", note: "GET /experiment/summary em andamento." },
  { id: "error", label: "Erro", note: "GET /experiment/summary falhou." },
];


function renderGallery() {
  const q = (s) => `?state=${s.id}&theme=${theme}`;
  const frame = (s, width, height, name) => `
    <div class="flex flex-col gap-1">
      <span class="text-xs font-medium text-muted-foreground">${name}</span>
      <div class="overflow-hidden rounded-lg border-2 bg-card">
        <iframe title="${s.id} ${name}" loading="lazy" data-w="${width}" data-frame="${s.id}-${width}"
          src="${q(s)}&frame=${s.id}-${width}" style="width:${width}px;height:${height}px;border:0;transform-origin:0 0;display:block"></iframe>
      </div>
    </div>`;
  document.getElementById("root").innerHTML = `
    <div class="min-h-dvh bg-muted p-6">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">M7 · Painel do experimento <span class="font-normal text-muted-foreground">versão 1</span></h1>
          <p class="text-sm text-muted-foreground">Rota /experimento. Todos os números são ilustrativos: ainda não há dados da coleta. Especificação em m7-experimento.md.</p>
        </div>
        <a class="rounded-md border bg-card px-3 py-2 text-sm font-medium" href="?theme=${theme === "dark" ? "light" : "dark"}">Ver no tema ${theme === "dark" ? "claro" : "escuro"}</a>
      </header>
      <div class="flex flex-col gap-10">
        ${STATES.map((s) => `
          <section>
            <h2 class="text-lg font-semibold">${s.label}</h2>
            <p class="mb-2 text-sm text-muted-foreground">${s.note} <a class="underline" target="_blank" href="${q(s)}">Abrir em tamanho real</a></p>
            <div class="flex items-start gap-6">
              ${frame(s, 375, 667, "Celular · 375 px")}
              ${frame(s, 1280, 800, "Notebook · 1280 px")}
            </div>
          </section>`).join("")}
      </div>
    </div>`;
  const fit = () => {
    const available = document.getElementById("root").clientWidth - 48 - 375 - 24 - 8;
    const scale = Math.min(1, Math.max(0.4, available / 1280));
    document.querySelectorAll("iframe[data-w='1280']").forEach((f) => {
      f.style.transform = `scale(${scale})`;
      const box = f.parentElement;
      box.style.width = `${1280 * scale + 4}px`;
      box.style.height = `${parseFloat(f.style.height) * scale + 4}px`;
    });
  };
  addEventListener("resize", fit);
  addEventListener("message", (e) => {
    const f = document.querySelector(`iframe[data-frame="${e.data?.frame}"]`);
    if (f && e.data.height > parseFloat(f.style.height)) { f.style.height = `${e.data.height}px`; fit(); }
  });
  fit();
}

if (stateId) {
  document.getElementById("root").innerHTML = (SCREENS[stateId] || SCREENS[STATES[0].id])();
  if (typeof afterRender === "function") afterRender(stateId);
} else {
  renderGallery();
}
if (window.lucide) lucide.createIcons();
if (stateId && parent !== window) {
  const frame = params.get("frame");
  const send = () => parent.postMessage({ frame, height: document.documentElement.scrollHeight }, "*");
  addEventListener("load", send);
  new ResizeObserver(send).observe(document.body);
}
</script>
</body>
</html>
