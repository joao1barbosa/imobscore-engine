const tile = (label, value, hint, bad) => `<div class="flex flex-col gap-1 rounded-lg ${bad ? "border border-destructive" : ""} bg-muted p-3 md:p-4"><span class="text-sm text-muted-foreground">${label}</span><span class="text-2xl font-semibold tabular-nums">${value}</span><span class="text-xs text-muted-foreground">${hint}</span></div>`;
const diagnostics = (bad) => panel("A cadeia convergiu?", "", `
  ${bad ? `<p role="alert" class="flex items-start gap-2 rounded-lg border border-destructive p-3 text-sm font-medium"><i data-lucide="triangle-alert" class="mt-0.5 text-destructive"></i>Os diagnósticos ficaram fora da faixa nesta rodada. Os pesos podem estar menos confiáveis.</p>` : `<p class="flex items-center gap-2 text-sm font-medium"><i data-lucide="circle-check" class="text-primary"></i>Diagnósticos dentro da faixa esperada.</p>`}
  <div class="grid grid-cols-2 gap-2 md:grid-cols-4 md:gap-3">
    ${tile("Aceitação", bad ? "9%" : "27%", "Parte dos passos aceitos. Entre 15% e 50% é saudável.", bad)}
    ${tile("R-hat", bad ? "1,12" : "1,01", "Perto de 1: as cadeias concordam.", bad)}
    ${tile("ESS", bad ? "180" : "612", "Amostras independentes equivalentes. Acima de 400 é bom.", bad)}
    ${tile("Tempo", "190 ms", "Tempo para recalcular depois da última escolha.")}
  </div>`);
const table = `<details class="text-sm"><summary class="cursor-pointer font-medium ${focusRing}">Ver como tabela</summary>
  <div class="mt-2 overflow-x-auto"><table class="w-full min-w-[420px] text-left tabular-nums"><thead class="text-muted-foreground"><tr><th class="py-1 font-medium">Característica</th><th class="font-medium">Priori</th><th class="font-medium">Posteriori</th><th class="font-medium">5% a 95%</th></tr></thead>
  <tbody>${WEIGHTS.map((w) => `<tr class="border-t"><td class="py-1">${w.label}</td><td>${num(w.prior_mean)}</td><td>${num(w.post_mean)}</td><td>${num(w.lo)} a ${num(w.hi)}</td></tr>`).join("")}</tbody></table></div></details>`;
const weightsPanel = (priorOnly) => panel("O que pesa para você", priorOnly ? "Ainda sem escolhas: os pesos são só os do perfil." : "À direita do zero, a característica aumenta sua preferência; à esquerda, reduz. A barra vai de 5% a 95%.", `
  <div class="flex flex-wrap gap-4">${priorOnly ? "" : legendItem("var(--chart-1)", "Depois das suas escolhas")}${legendItem("var(--chart-2)", "Só o perfil")}</div>
  <div id="weights" data-prior-only="${priorOnly ? 1 : 0}"></div>${table}`);
const tracePanel = panel("Traço das cadeias", "Cada linha é uma cadeia percorrendo os valores possíveis de um peso. Linhas misturadas indicam que elas concordam.", `
  <div class="flex flex-col gap-1.5 md:w-72"><label for="feature" class="text-sm font-medium">Peso</label>
  <button id="feature" type="button" class="flex h-11 items-center justify-between rounded-md border border-input bg-card px-3 text-base ${focusRing}"><span>Distância do centro</span><i data-lucide="chevron-down" class="text-muted-foreground"></i></button></div>
  <div class="flex flex-wrap gap-4">${[1, 2, 3, 4].map((i) => legendItem(`var(--chart-${i})`, `Cadeia ${i}`, true)).join("")}</div>
  <div id="trace"></div>`);
const intro = (sub) => `<div class="flex flex-col gap-1"><h1 class="text-2xl font-semibold tracking-tight md:text-3xl">O que o modelo aprendeu</h1><p class="text-muted-foreground">${sub}</p></div>`;
const SCREENS = {
  normal: () => shell(intro("Perfil Família · 3 escolhas respondidas") + weightsPanel(false) + diagnostics(false) + tracePanel, OPTS),
  alert: () => shell(intro("Perfil Família · 3 escolhas respondidas") + weightsPanel(false) + diagnostics(true) + tracePanel, OPTS),
  "no-pairs": () => shell(intro("Perfil Família · nenhuma escolha respondida") + weightsPanel(true), OPTS),
  loading: () => shell(intro("Perfil Família · 3 escolhas respondidas") + `<div aria-busy="true" class="flex flex-col gap-4"><span class="sr-only" role="status">Carregando o modelo</span>${skeleton("h-96")}${skeleton("h-40")}</div>`, OPTS),
  error: () => message("triangle-alert", "bg-destructive text-destructive-foreground", "Não foi possível carregar o modelo", "Suas escolhas estão salvas. Tente de novo.", retry, OPTS),
};
function drawWeights(el) {
  const priorOnly = el.dataset.priorOnly === "1";
  const width = el.clientWidth, narrow = width < 500, left = narrow ? 134 : 170, right = 12, rowH = 30, top = 4, bottom = 24;
  const min = -3, max = 3, x = (v) => left + ((Math.max(min, Math.min(max, v)) - min) / (max - min)) * (width - left - right);
  const height = top + rowH * WEIGHTS.length + bottom;
  const textC = css("--muted-foreground"), fg = css("--foreground"), grid = css("--border"), surf = css("--card");
  let s = `<svg width="${width}" height="${height}" role="img" aria-label="Pesos de cada característica, antes e depois das escolhas">`;
  [-3, -2, -1, 0, 1, 2, 3].forEach((t) => { s += `<line x1="${x(t)}" x2="${x(t)}" y1="${top}" y2="${height - bottom}" stroke="${t === 0 ? textC : grid}" stroke-width="1"/><text x="${x(t)}" y="${height - 8}" text-anchor="middle" font-size="12" fill="${textC}">${t < 0 ? "−" + -t : t}</text>`; });
  WEIGHTS.forEach((w, i) => {
    const y = top + rowH * i + rowH / 2;
    s += `<text x="0" y="${y + 4}" font-size="${narrow ? 12 : 14}" fill="${fg}">${w.label}</text>`;
    const mark = (lo, hi, mean, color, dy, label) => `<g><title>${w.label}, ${label}: ${num(mean)} (de ${num(lo)} a ${num(hi)})</title><line x1="${x(lo)}" x2="${x(hi)}" y1="${y + dy}" y2="${y + dy}" stroke="${color}" stroke-width="2" stroke-linecap="round"/><circle cx="${x(mean)}" cy="${y + dy}" r="4.5" fill="${color}" stroke="${surf}" stroke-width="2"/></g>`;
    s += mark(w.prior_lo, w.prior_hi, w.prior_mean, css("--chart-2"), priorOnly ? 0 : 5, "só o perfil");
    if (!priorOnly) s += mark(w.lo, w.hi, w.post_mean, css("--chart-1"), -5, "depois das escolhas");
  });
  el.innerHTML = s + "</svg>";
}
function drawTrace(el) {
  const width = el.clientWidth, height = 200, left = 30, right = 8, top = 6, bottom = 22;
  const all = TRACE.flat(), lo = Math.floor(Math.min(...all)), hi = Math.ceil(Math.max(...all));
  const n = TRACE[0].length, x = (i) => left + (i / (n - 1)) * (width - left - right), y = (v) => top + ((hi - v) / (hi - lo)) * (height - top - bottom);
  const textC = css("--muted-foreground"), grid = css("--border");
  let s = `<svg width="${width}" height="${height}" role="img" aria-label="Traço de quatro cadeias para o peso escolhido">`;
  for (let t = lo; t <= hi; t++) s += `<line x1="${left}" x2="${width - right}" y1="${y(t)}" y2="${y(t)}" stroke="${grid}"/><text x="${left - 6}" y="${y(t) + 4}" text-anchor="end" font-size="12" fill="${textC}">${t < 0 ? "−" + -t : t}</text>`;
  s += `<text x="${width - right}" y="${height - 6}" text-anchor="end" font-size="12" fill="${textC}">250 pontos guardados</text>`;
  TRACE.forEach((chain, c) => { s += `<polyline fill="none" stroke="${css(`--chart-${c + 1}`)}" stroke-width="1.25" stroke-linejoin="round" opacity="0.85" points="${chain.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}"><title>Cadeia ${c + 1}</title></polyline>`; });
  el.innerHTML = s + "</svg>";
}
function afterRender() {
  const paint = () => {
    ["weights", "trace"].forEach((id) => { const el = document.getElementById(id); if (el) el.innerHTML = ""; });
    const w = document.getElementById("weights"); if (w) drawWeights(w);
    const t = document.getElementById("trace"); if (t) drawTrace(t);
  };
  paint();
  addEventListener("resize", paint);
  addEventListener("load", paint);
  setTimeout(paint, 400);
  if (document.fonts) document.fonts.ready.then(paint);
}
const STATES = [
  { id: "normal", label: "Normal", note: "É a tela que conversa com a banca. Cada diagnóstico tem uma frase para leigos." },
  { id: "alert", label: "Diagnósticos fora da faixa", note: "ok = false: alerta com ícone e texto, sem bloquear nada." },
  { id: "no-pairs", label: "Sem escolhas", note: "Sessão com 0 pares: só os pesos do perfil, sem traço." },
  { id: "loading", label: "Carregando", note: "GET /posterior em andamento." },
  { id: "error", label: "Erro", note: "GET /posterior falhou." },
];


function renderGallery() {
  const q = (s) => `?state=${s.id}&theme=${theme}`;
  const frame = (s, width, height, name) => `
    <div class="flex flex-col gap-1">
      <span class="text-xs font-medium text-muted-foreground">${name}</span>
      <div class="overflow-hidden rounded-lg border-2 bg-card">
        <iframe title="${s.id} ${name}" loading="lazy" data-w="${width}" data-frame="${s.id}-${width}"
          src="${q(s)}&frame=${s.id}-${width}" style="width:${width}px;height:${height}px;border:0;transform-origin:0 0;display:block"></iframe>
      </div>
    </div>`;
  document.getElementById("root").innerHTML = `
    <div class="min-h-dvh bg-muted p-6">
      <header class="mb-6 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight">M6 · Painel do modelo <span class="font-normal text-muted-foreground">versão 1</span></h1>
          <p class="text-sm text-muted-foreground">Rota /modelo. Pesos calculados com o catálogo real, em uma aproximação da posteriori; diagnósticos ilustrativos até a A05. Especificação em m6-modelo.md.</p>
        </div>
        <a class="rounded-md border bg-card px-3 py-2 text-sm font-medium" href="?theme=${theme === "dark" ? "light" : "dark"}">Ver no tema ${theme === "dark" ? "claro" : "escuro"}</a>
      </header>
      <div class="flex flex-col gap-10">
        ${STATES.map((s) => `
          <section>
            <h2 class="text-lg font-semibold">${s.label}</h2>
            <p class="mb-2 text-sm text-muted-foreground">${s.note} <a class="underline" target="_blank" href="${q(s)}">Abrir em tamanho real</a></p>
            <div class="flex items-start gap-6">
              ${frame(s, 375, 667, "Celular · 375 px")}
              ${frame(s, 1280, 800, "Notebook · 1280 px")}
            </div>
          </section>`).join("")}
      </div>
    </div>`;
  const fit = () => {
    const available = document.getElementById("root").clientWidth - 48 - 375 - 24 - 8;
    const scale = Math.min(1, Math.max(0.4, available / 1280));
    document.querySelectorAll("iframe[data-w='1280']").forEach((f) => {
      f.style.transform = `scale(${scale})`;
      const box = f.parentElement;
      box.style.width = `${1280 * scale + 4}px`;
      box.style.height = `${parseFloat(f.style.height) * scale + 4}px`;
    });
  };
  addEventListener("resize", fit);
  addEventListener("message", (e) => {
    const f = document.querySelector(`iframe[data-frame="${e.data?.frame}"]`);
    if (f && e.data.height > parseFloat(f.style.height)) { f.style.height = `${e.data.height}px`; fit(); }
  });
  fit();
}

if (stateId) {
  document.getElementById("root").innerHTML = (SCREENS[stateId] || SCREENS[STATES[0].id])();
  if (typeof afterRender === "function") afterRender(stateId);
} else {
  renderGallery();
}
if (window.lucide) lucide.createIcons();
if (stateId && parent !== window) {
  const frame = params.get("frame");
  const send = () => parent.postMessage({ frame, height: document.documentElement.scrollHeight }, "*");
  addEventListener("load", send);
  new ResizeObserver(send).observe(document.body);
}
</script>
</body>
</html>
