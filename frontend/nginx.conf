server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O log de acesso fica desligado de propósito: a tela inicial promete que
    # nenhum dado pessoal é coletado, e o IP de quem responde à coleta não deve
    # ficar registrado no servidor.
    access_log off;

    location /api/ {
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri /index.html;
    }
}
